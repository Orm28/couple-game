<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>שאלות של תשוקה & היכרות | המשחק הזוגי</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg: #0b0b0e;
      --card-bg: rgba(23, 23, 28, 0.92);
      --gold-primary: #f59e0b;
      --gold-light: #fde68a;
      --gold-gradient: linear-gradient(135deg, #f59e0b 0%, #fbbf24 50%, #d97706 100%);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: rgba(245, 158, 11, 0.25);
      --border-active: rgba(245, 158, 11, 0.8);
      --rose: #f43f5e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Assistant', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      background-image: radial-gradient(circle at 50% 10%, rgba(245, 158, 11, 0.08) 0%, transparent 60%),
                        radial-gradient(circle at 10% 80%, rgba(244, 63, 94, 0.07) 0%, transparent 50%);
    }
    .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; margin: auto; }
    
    /* Login Modal */
    #loginScreen {
      position: fixed; inset: 0; background: rgba(5,5,8,0.95);
      z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .login-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 26px 20px; width: 100%; max-width: 380px;
      text-align: center; display: flex; flex-direction: column; gap: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    .login-input {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px; color: #fff; font-family: inherit;
      font-size: 1.1rem; text-align: center; outline: none;
    }
    .login-input:focus { border-color: var(--gold-primary); }

    /* Players Bar */
    .players-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 10px 16px; font-size: 0.9rem;
    }
    .player-tag { display: flex; align-items: center; gap: 6px; font-weight: 700; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.green { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .dot.yellow { background: #f59e0b; animation: pulse 1.4s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* Heart Meter */
    .heart-meter {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 18px; padding: 14px 18px; text-align: center;
      display: flex; flex-direction: column; gap: 8px;
    }
    .heart-icon {
      font-size: 2rem; color: var(--rose);
      display: inline-block; animation: heartbeat 1.5s infinite;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.15); }
      28% { transform: scale(1); }
      42% { transform: scale(1.15); }
      70% { transform: scale(1); }
    }
    .progress-bar-bg { width: 100%; height: 12px; background: rgba(255, 255, 255, 0.08); border-radius: 999px; overflow: hidden; }
    .progress-bar-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #f43f5e, #fbbf24);
      border-radius: 999px; transition: width 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Main Card */
    .card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 22px 18px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .badge {
      align-self: flex-start; font-size: 0.75rem; font-weight: 700;
      padding: 4px 12px; border-radius: 999px; background: rgba(245, 158, 11, 0.15);
      color: var(--gold-light); border: 1px solid var(--border);
    }
    .badge.fnt { background: rgba(244, 63, 94, 0.15); color: #fda4af; border-color: rgba(244, 63, 94, 0.3); }
    .badge.int { background: rgba(139, 92, 246, 0.15); color: #c4b5fd; border-color: rgba(139, 92, 246, 0.3); }
    .question-text { font-size: 1.25rem; font-weight: 700; line-height: 1.45; min-height: 65px; color: #fff; }

    /* Answers */
    .answers-grid { display: flex; flex-direction: column; gap: 9px; }
    .ans-btn {
      background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text); font-family: inherit; font-size: 0.95rem; padding: 12px 14px;
      border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: space-between;
      transition: all 0.2s ease; text-align: right;
    }
    .ans-btn:active { transform: scale(0.98); }
    .ans-btn.selected { border-color: var(--gold-primary); background: rgba(245, 158, 11, 0.2); color: var(--gold-light); font-weight: 700; }
    .ans-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Reveal Answers comparison */
    .reveal-box {
      display: none; background: rgba(245, 158, 11, 0.08); border: 1px solid var(--border-active);
      border-radius: 14px; padding: 14px; margin-top: 6px;
    }
    .reveal-box.show { display: flex; flex-direction: column; gap: 8px; animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .comparison-grid { display: flex; justify-content: space-around; gap: 10px; margin-top: 6px; }
    .comp-col { flex: 1; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; text-align: center; }
    .comp-name { font-size: 0.8rem; color: var(--gold-light); font-weight: 700; margin-bottom: 4px; }
    .comp-ans { font-size: 0.95rem; font-weight: 600; }

    /* Action Buttons */
    .primary-btn {
      background: var(--gold-gradient); color: #111; font-family: inherit; font-size: 1rem;
      font-weight: 800; border: none; padding: 13px; border-radius: 12px; cursor: pointer; width: 100%;
    }
    .share-btn {
      background: #25D366; color: #fff; font-family: inherit; font-size: 0.95rem; font-weight: 700;
      border: none; padding: 12px; border-radius: 12px; cursor: pointer; width: 100%;
      display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- מסך הזנת שם -->
  <div id="loginScreen">
    <div class="login-card">
      <div style="font-size:2.2rem;">✨❤️</div>
      <h2 style="font-size:1.5rem; color:var(--gold-light);">המשחק הזוגי שלכם</h2>
      <p style="font-size:0.9rem; color:var(--text-muted);">הכניסו את השם שלכם כדי להצטרף לחדר המשותף</p>
      <input type="text" id="nameInput" class="login-input" placeholder="השם שלך..." maxlength="15">
      <button class="primary-btn" onclick="joinGame()">התחל לשחק 🎲</button>
    </div>
  </div>

  <div class="container">
    <!-- Players status -->
    <div class="players-bar">
      <div class="player-tag">
        <span class="dot green"></span>
        <span id="myNameLabel">את/ה</span>
      </div>
      <div style="font-size:0.8rem; color:var(--gold-light); font-weight:700;">משחקים יחד</div>
      <div class="player-tag">
        <span class="dot yellow" id="partnerDot"></span>
        <span id="partnerNameLabel">מחכה לו...</span>
      </div>
    </div>

    <!-- Heart Compatibility Meter -->
    <div class="heart-meter">
      <div style="display:flex; justify-content:center; align-items:center; gap:8px;">
        <span class="heart-icon">❤️</span>
        <span style="font-size:1.4rem; font-weight:800; color:var(--gold-light);" id="meterScore">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="meterFill"></div>
      </div>
      <div style="font-size:0.75rem; color:var(--text-muted);" id="meterCaption">ענו ביחד כדי לחשוף את אחוזי ההתאמה והתשוקה!</div>
    </div>

    <!-- Active Question Card -->
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="badge" id="categoryBadge">היכרות ומסתורין</span>
        <span style="font-size:0.8rem; color:var(--text-muted);" id="qCounter">שאלה אקראית</span>
      </div>

      <div class="question-text" id="questionText">טוען שאלה...</div>

      <div class="answers-grid" id="answersGrid">
        <button class="ans-btn" onclick="selectAnswer(1, '🔥 עף/ה על זה לחלוטין!')">
          <span>🔥 עף/ה על זה לחלוטין!</span>
          <span>1</span>
        </button>
        <button class="ans-btn" onclick="selectAnswer(2, '✨ מסקרן ומדליק מאוד')">
          <span>✨ מסקרן ומדליק מאוד</span>
          <span>2</span>
        </button>
        <button class="ans-btn" onclick="selectAnswer(3, '👀 תלוי בסיטואציה')">
          <span>👀 תלוי בסיטואציה</span>
          <span>3</span>
        </button>
        <button class="ans-btn" onclick="selectAnswer(4, '🙈 פחות הכיוון שלי')">
          <span>🙈 פחות הכיוון שלי</span>
          <span>4</span>
        </button>
      </div>

      <!-- Reveal Box -->
      <div class="reveal-box" id="revealBox">
        <div style="text-align:center; font-size:1.1rem; font-weight:800; color:var(--gold-light);" id="matchTitle">התאמה מעולה! 🔥</div>
        <div class="comparison-grid">
          <div class="comp-col">
            <div class="comp-name" id="myCompName">אני</div>
            <div class="comp-ans" id="myCompAns">-</div>
          </div>
          <div class="comp-col">
            <div class="comp-name" id="partnerCompName">בן הזוג</div>
            <div class="comp-ans" id="partnerCompAns">-</div>
          </div>
        </div>
      </div>

      <button class="primary-btn" id="nextBtn" onclick="requestNextQuestion()" style="display:none;">השאלה הבאה 🎲</button>
    </div>

    <!-- Room Share -->
    <a href="#" class="share-btn" id="whatsappShareBtn" target="_blank">
      <span>📲</span> שלחי לו הזמנה לחדר בווטסאפ
    </a>
  </div>

  <script>
    // מאגר 150 שאלות מלא ומגוון
    const allQuestions = [
      // היכרות ומסתורין
      { t: "מה הדבר הראשון שמשך את תשומת הלב שלך בפרופיל או בהודעות שלי?", c: "היכרות ומסתורין", cls: "" },
      { t: "מה הדבר הראשון שאתה מסתכל עליו כשאתה רואה אישה לראשונה במציאות?", c: "היכרות ומסתורין", cls: "" },
      { t: "מה הווייב שלך לדייט ראשון: יין במקום אינטימי וחשוך או בר מלא אנרגיה?", c: "היכרות ומסתורין", cls: "" },
      { t: "אם היית צריך לנחש לפי ההתכתבות בינינו, איך לדעתך אני מנשקת?", c: "היכרות ומסתורין", cls: "" },
      { t: "מה התכונה שהכי מושכת אותך באופי של מישהי ומדליקה אותך עוד לפני המראה?", c: "היכרות ומסתורין", cls: "" },
      { t: "מה הבגד שאתה מרגיש בו הכי סקסי ומושך בעולם?", c: "היכרות ומסתורין", cls: "" },
      { t: "איזה ריח או בושם של אישה משגע אותך לגמרי?", c: "היכרות ומסתורין", cls: "" },
      { t: "אם היינו נפגשים עכשיו לדייט ספונטני של שעה בלבד, מה היינו עושים?", c: "היכרות ומסתורין", cls: "" },
      { t: "מה עובר לך בראש ברגע שיש שתיקה קצרה אבל טעונה במתח בין שני אנשים?", c: "היכרות ומסתורין", cls: "" },
      { t: "מה ההרפתקה הכי ספונטנית או מטורפת שיצא לך לעשות בלי לתכנן?", c: "היכרות ומסתורין", cls: "" },
      { t: "מי בדרך כלל יוזם אצלך: אתה אוהב לרדוף ולהוביל, או שאוהב שיוזמים עליך?", c: "היכרות ומסתורין", cls: "" },
      { t: "מה המשפט או הרמז הכי חכם וסקסי שמישהי שלחה לך בהודעה?", c: "היכרות ומסתורין", cls: "" },
      { t: "אם היית יכול לקרוא לי את המחשבות למשך 60 שניות עכשיו, מה היית רוצה לדעת?", c: "היכרות ומסתורין", cls: "" },
      { t: "מה משהו שאסור לי בשום אופן ללבוש לדייט שלנו אם אתה רוצה להתרכז בשיחה?", c: "היכרות ומסתורין", cls: "" },
      { t: "מה הדבר הכי נועז שאי פעם אמרת למישהי בדייט ראשון?", c: "היכרות ומסתורין", cls: "" },
      { t: "מה בעיניך הופך נשיקה ראשונה לסרט קולנוע במקום לעוד נשיקה רגילה?", c: "היכרות ומסתורין", cls: "" },
      { t: "מה הנשק הסודי שלך כשאתה רוצה לפתות מישהי בלי להגיד מילה?", c: "היכרות ומסתורין", cls: "" },
      { t: "מה עמדתך לגבי סקס בדייט ראשון: זורם אם יש חיבור מטורף, או לבנות מתח?", c: "היכרות ומסתורין", cls: "" },
      { t: "אם היינו מסיימים את הדייט בשעה 3 לפנות בוקר ברכב שלך, איזה שיר היה מתנגן?", c: "היכרות ומסתורין", cls: "" },
      { t: "אם תהיה נשיקה בסוף הדייט – מי לדעתך ייזום אותה ראשון?", c: "היכרות ומסתורין", cls: "" },
      { t: "מה השאלה הכי חצופה שמתחשק לך לשאול אותי עכשיו ואתה מתאפק?", c: "היכרות ומסתורין", cls: "" },

      // סקס ופנטזיה
      { t: "מה הדבר הראשון שחשבת עליו בפעם הראשונה שראית אותי בעירום?", c: "סקס ופנטזיה", cls: "fnt" },
      { t: "איזה בגד שלי גורם לך לרצות להוריד אותו ממני מיד?", c: "סקס ופנטזיה", cls: "fnt" },
      { t: "מה הדבר שאני עושה במיטה שהכי מוציא אותך מדעתך?", c: "סקס ופנטזיה", cls: "fnt" },
      { t: "אם היית יכול לבחור עכשיו תנוחה אחת שנעשה בה סקס, מה היא הייתה?", c: "סקס ופנטזיה", cls: "fnt" },
      { t: "מה עדיף בעיניך כרגע: סקס פראי וחזק או איטי ועמוק?", c: "סקס ופנטזיה", cls: "fnt" },
      { t: "מה המקום הכי מוזר בבית שלא ניסינו עדיין והיית רוצה שנעשה בו סקס?", c: "סקס ופנטזיה", cls: "fnt" },
      { t: "מה עדיף: שאני אשלוט בך לחלוטין או שאתה תשלוט בי?", c: "סקס ופנטזיה", cls: "fnt" },
      { t: "איזו דמות או תפקיד היית רוצה שאגלם במיטה רק בשבילך?", c: "סקס ופנטזיה", cls: "fnt" },
      { t: "האם יש פנטזיה ספציפית שאתה חושב עליה כשאתה מאונן לבד?", c: "סקס ופנטזיה", cls: "fnt" },
      { t: "מה דעתך שנקשור אחד את השני או נשתמש בכיסוי עיניים כשאחד חסר אונים?", c: "סקס ופנטזיה", cls: "fnt" },
      { t: "איזה מקום בחוץ (רכב, חוף מבודד, טבע) הכי מדליק אותך לנסות יחד?", c: "סקס ופנטזיה", cls: "fnt" },
      { t: "האם יש צעצוע מין שתמיד סקרן אותך לנסות ביחד ועוד לא דיברנו עליו?", c: "סקס ופנטזיה", cls: "fnt" },
      { t: "מה הדבר הכי מלוכלך ונועז שהיית רוצה שאלחש לך באוזן תוך כדי סקס?", c: "סקס ופנטזיה", cls: "fnt" },
      { t: "האם אתה אוהב משיכות שיער, ספאנקים בישבן או נשיכות בזמן האקט?", c: "סקס ופנטזיה", cls: "fnt" },
      { t: "מה דעתך על סקס מול מראה גדולה כדי שנוכל לראות הכל?", c: "סקס ופנטזיה", cls: "fnt" },
      { t: "אם הייתי נותנת לך שליטה מלאה עליי לשעה שלמה ללא התנגדות, מה היית עושה?", c: "סקס ופנטזיה", cls: "fnt" },
      { t: "מה דעתך על לנסות סקס אנאלי או משחקים באזור הזה?", c: "סקס ופנטזיה", cls: "fnt" },
      { t: "איזה סוד מיני עליך עדיין לא סיפרת לי עד היום?", c: "סקס ופנטזיה", cls: "fnt" },
      { t: "מה היית רוצה שאעשה לך עכשיו במשך 5 דקות שלמות בלי שתזוז בכלל?", c: "סקס ופנטזיה", cls: "fnt" },
      { t: "איך אתה רוצה שהערב הזה יסתיים במיטה?", c: "סקס ופנטזיה", cls: "fnt" },

      // אינטימיות וחיבור
      { t: "איזה אזור בגוף שלך הכי רגיש למגע שאנשים בדרך כלל מפספסים?", c: "אינטימיות וחיבור", cls: "int" },
      { t: "מה הנשיקה הכי בלתי נשכחת שהייתה לך עד היום?", c: "אינטימיות וחיבור", cls: "int" },
      { t: "איך נראה המשחק המקדים המושלם מבחינתך?", c: "אינטימיות וחיבור", cls: "int" },
      { t: "מה המגע שלי שהכי מהר גורם לך לגירוי חזק?", c: "אינטימיות וחיבור", cls: "int" },
      { t: "מה גורם לך להרגיש לגמרי בנוח להשתחרר במיטה?", c: "אינטימיות וחיבור", cls: "int" },
      { t: "מה גורם לך להרגיש הכי נחשק/ת ונאהב/ת?", c: "אינטימיות וחיבור", cls: "int" },
      { t: "מה החלק האהוב עליך ברגעים שאחרי הסקס?", c: "אינטימיות וחיבור", cls: "int" },
      { t: "מה הדבר הכי משמעותי שהופך סקס מסתם מגע פיזי לחוויה עמוקה?", c: "אינטימיות וחיבור", cls: "int" }
    ];

    let myName = localStorage.getItem('cg_my_name') || '';
    let partnerName = 'בן הזוג';
    let myAns = null;
    let myAnsText = '';
    let partnerAns = null;
    let partnerAnsText = '';
    let totalScore = 0;
    let questionsCount = 0;

    // ניהול חדר
    const urlParams = new URLSearchParams(window.location.search);
    let roomId = urlParams.get('room');
    if (!roomId) {
      roomId = 'cg_' + Math.random().toString(36).substring(2, 9);
      const newUrl = window.location.origin + window.location.pathname + '?room=' + roomId;
      window.history.replaceState(null, '', newUrl);
    }

    const shareUrl = window.location.origin + window.location.pathname + '?room=' + roomId;
    document.getElementById('whatsappShareBtn').href = `https://api.whatsapp.com/send?text=${encodeURIComponent('בוא נשחק במשחק השאלות הזוגי שלנו בזמן אמת ❤️: ' + shareUrl)}`;

    if (myName) {
      document.getElementById('nameInput').value = myName;
    }

    // חיבור ל-MQTT בענן (חינמי, מהיר ומאובטח)
    const topic = `couplegame/room/${roomId}`;
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { keepalive: 60 });

    client.on('connect', () => {
      client.subscribe(topic);
      if (myName) announcePresence();
    });

    client.on('message', (t, msg) => {
      const data = JSON.parse(msg.toString());
      if (data.sender === myName) return;

      if (data.type === 'join') {
        partnerName = data.name;
        updatePartnerUI(true);
        // שליחת שלום בחזרה כדי ששני הצדדים יכירו
        client.publish(topic, JSON.stringify({ type: 'ack_join', name: myName, sender: myName }));
      } else if (data.type === 'ack_join') {
        partnerName = data.name;
        updatePartnerUI(true);
      } else if (data.type === 'answer') {
        partnerAns = data.ansNum;
        partnerAnsText = data.ansText;
        checkBothAnswered();
      } else if (data.type === 'next_q') {
        applyNewQuestion(data.qIndex);
      }
    });

    function joinGame() {
      const input = document.getElementById('nameInput').value.trim();
      if (!input) return alert('אנא הכנס/י שם');
      myName = input;
      localStorage.setItem('cg_my_name', myName);
      document.getElementById('myNameLabel').innerText = myName;
      document.getElementById('myCompName').innerText = myName;
      document.getElementById('loginScreen').style.display = 'none';

      announcePresence();
      // בחירת שאלה אקראית ראשונה
      const randomIdx = Math.floor(Math.random() * allQuestions.length);
      applyNewQuestion(randomIdx);
    }

    function announcePresence() {
      client.publish(topic, JSON.stringify({ type: 'join', name: myName, sender: myName }));
    }

    function updatePartnerUI(connected) {
      document.getElementById('partnerNameLabel').innerText = partnerName;
      document.getElementById('partnerCompName').innerText = partnerName;
      const dot = document.getElementById('partnerDot');
      if (connected) {
        dot.className = 'dot green';
      }
    }

    function applyNewQuestion(index) {
      const q = allQuestions[index % allQuestions.length];
      document.getElementById('questionText').innerText = q.t;
      const badge = document.getElementById('categoryBadge');
      badge.innerText = q.c;
      badge.className = 'badge ' + q.cls;
      document.getElementById('qCounter').innerText = `שאלה #${(index % allQuestions.length) + 1}`;

      // איפוס סבב
      myAns = null;
      partnerAns = null;
      document.querySelectorAll('.ans-btn').forEach(btn => {
        btn.classList.remove('selected');
        btn.disabled = false;
      });
      document.getElementById('revealBox').classList.remove('show');
      document.getElementById('nextBtn').style.display = 'none';
    }

    function selectAnswer(num, text) {
      if (myAns !== null) return;
      myAns = num;
      myAnsText = text;

      const btns = document.querySelectorAll('.ans-btn');
      btns[num - 1].classList.add('selected');
      btns.forEach(b => b.disabled = true);

      client.publish(topic, JSON.stringify({
        type: 'answer',
        ansNum: num,
        ansText: text,
        sender: myName
      }));

      checkBothAnswered();
    }

    function checkBothAnswered() {
      if (myAns !== null && partnerAns !== null) {
        questionsCount++;
        const isMatch = myAns === partnerAns;
        
        if (isMatch) {
          totalScore += 25;
          confetti({ particleCount: 75, spread: 70, origin: { y: 0.6 } });
          document.getElementById('matchTitle').innerText = "התאמה מושלמת! 🔥❤️";
        } else {
          totalScore += 12;
          document.getElementById('matchTitle').innerText = "ניגודים נמשכים... ✨";
        }

        // עדכון תשובות בצד
        document.getElementById('myCompAns').innerText = myAnsText;
        document.getElementById('partnerCompAns').innerText = partnerAnsText;

        // חישוב מד התאמה
        const percent = Math.min(Math.round((totalScore / (questionsCount * 25)) * 100), 100);
        document.getElementById('meterScore').innerText = percent + '%';
        document.getElementById('meterFill').style.width = percent + '%';

        document.getElementById('revealBox').classList.add('show');
        document.getElementById('nextBtn').style.display = 'block';
      }
    }

    function requestNextQuestion() {
      const nextIdx = Math.floor(Math.random() * allQuestions.length);
      client.publish(topic, JSON.stringify({
        type: 'next_q',
        qIndex: nextIdx,
        sender: myName
      }));
      applyNewQuestion(nextIdx);
    }
  </script>
</body>
</html>
